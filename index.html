<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2B45D4">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Idioma IA">
<title>Idioma IA</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap">
<style>:root{padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
body{margin:0}
[hidden]{display:none!important}

/* Layout: coluna única de celular (até 480px), conteúdo rolável e barra de 5 abas embaixo.
   Tudo que está no idioma estudado aparece em serifa; a interface fica em sans.
   Palavra nova = marca-texto amarelo, como num caderno de estudo. */
:root{
  --bg:#EEF1F6; --surface:#FFFFFF; --sunk:#E2E7F0; --ink:#141B33; --muted:#566080; --line:#D2D8E6;
  --accent:#2B45D4; --accent-ink:#FFFFFF; --accent-soft:#E1E6FB;
  --mark:#FFD84A; --mark-ink:#2A2200;
  --good:#0F7A57; --good-soft:#DBF2E8; --warn:#A85A08; --warn-soft:#FBEAD3;
  --font-display:'Bricolage Grotesque','Atkinson Hyperlegible',system-ui,sans-serif;
  --font-ui:'Atkinson Hyperlegible',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --font-alvo:'Source Serif 4',Georgia,'Times New Roman',serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0D1120; --surface:#171D33; --sunk:#111629; --ink:#ECEFF8; --muted:#9CA6C5; --line:#2B3353;
  --accent:#8C9CFF; --accent-ink:#0B1030; --accent-soft:#222B55;
  --mark:#FFD84A; --mark-ink:#2A2200;
  --good:#5BD3A4; --good-soft:#133A2E; --warn:#F2B166; --warn-soft:#3A2911; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0D1120; --surface:#171D33; --sunk:#111629; --ink:#ECEFF8; --muted:#9CA6C5; --line:#2B3353;
  --accent:#8C9CFF; --accent-ink:#0B1030; --accent-soft:#222B55;
  --mark:#FFD84A; --mark-ink:#2A2200;
  --good:#5BD3A4; --good-soft:#133A2E; --warn:#F2B166; --warn-soft:#3A2911; color-scheme:dark }

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font-ui);font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%}
#app{height:100%;max-width:480px;margin:0 auto;display:flex;flex-direction:column;background:var(--bg)}
@media (min-width:520px){ #app{border-inline:1px solid var(--line)} }
#view{flex:1;min-height:0;overflow-y:auto;padding-block:22px 28px;padding-inline:18px;display:flex;flex-direction:column;gap:18px}
#view > *{flex-shrink:0}
h1,h2,h3,p{margin:0}
h1{font:700 30px/1.08 var(--font-display);letter-spacing:-.02em;text-wrap:balance}
h2{font:700 21px/1.15 var(--font-display);letter-spacing:-.01em;text-wrap:balance}
h3{font:700 16px/1.25 var(--font-ui)}
.eyebrow{font:700 12px/1.2 var(--font-ui);letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.small{font-size:14px}
.stack{display:flex;flex-direction:column;gap:12px}
.stack.tight{gap:6px}
.row{display:flex;align-items:center;gap:10px}
.row.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.spacer{flex:1}
.alvo{font-family:var(--font-alvo);font-size:18px;line-height:1.4}
.alvo.big{font-size:34px;line-height:1.1;font-weight:600}
mark,.mark{background:var(--mark);color:var(--mark-ink);padding:0 .22em;border-radius:4px;box-decoration-break:clone;-webkit-box-decoration-break:clone}

button{font-family:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:54px;padding:0 18px;border:0;border-radius:14px;background:var(--accent);color:var(--accent-ink);font:700 17px var(--font-ui)}
.btn:disabled{opacity:.45;cursor:default}
.btn.sec{background:var(--surface);color:var(--ink);border:1.5px solid var(--line)}
.btn.inv{background:var(--accent-ink);color:var(--accent)}
.btn.link{background:none;color:var(--accent);min-height:44px;width:auto;padding:0 6px;font-size:15px}
.btn.danger{background:var(--surface);color:var(--warn);border:1.5px solid var(--warn)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:44px;padding:0 16px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font:400 15px var(--font-ui)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink);font-weight:700}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px}
.card.flat{background:var(--sunk);border-color:transparent}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-weight:700;font-size:15px}
input[type=text],input[type=email],input[type=password],textarea{width:100%;min-height:52px;padding:12px 14px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font:400 17px var(--font-ui)}
textarea{min-height:110px;resize:vertical;font-family:var(--font-alvo);font-size:18px}
.badge{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font:700 13px var(--font-ui);letter-spacing:.04em}
.ic{display:inline-flex;width:22px;height:22px}
.ic svg{width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}

/* barra de abas */
nav#tabs{display:flex;background:var(--surface);border-top:1px solid var(--line)}
nav#tabs button{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 2px 8px;border:0;background:none;color:var(--muted);font:400 12px var(--font-ui)}
nav#tabs button[aria-current="page"]{color:var(--accent);font-weight:700}

/* missão do dia */
.mission{background:var(--accent);color:var(--accent-ink);border-radius:22px;padding:20px;display:flex;flex-direction:column;gap:14px}
.mission .eyebrow{color:inherit;opacity:.8}
.mission .chip{background:transparent;color:inherit;border-color:currentColor;opacity:.75}
.mission .chip[aria-pressed="true"]{background:var(--accent-ink);color:var(--accent);border-color:var(--accent-ink);opacity:1}
.streak{display:flex;align-items:center;gap:8px;font-weight:700}
.streak .ic{color:var(--warn)}

/* barras */
.bar{height:10px;border-radius:999px;background:var(--sunk);overflow:hidden}
.bar > i{display:block;height:100%;border-radius:999px;background:var(--accent)}
.bar.good > i{background:var(--good)}
.skill{display:grid;grid-template-columns:104px 1fr 44px;align-items:center;gap:10px;font-size:15px}
.skill b{font-variant-numeric:tabular-nums;text-align:right;font-weight:700}
.steps{display:flex;gap:4px}
.steps i{flex:1;height:6px;border-radius:999px;background:var(--sunk)}
.steps i.on{background:var(--accent)}

/* linha do CEFR, como um mapa de metrô */
.line{display:flex;align-items:flex-start;position:relative;padding-top:4px}
.line::before{content:"";position:absolute;left:7%;right:7%;top:13px;height:4px;border-radius:2px;background:var(--line)}
.stop{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;position:relative;font:700 13px var(--font-ui);color:var(--muted)}
.stop i{width:22px;height:22px;border-radius:50%;background:var(--bg);border:4px solid var(--line)}
.stop.done i{background:var(--accent);border-color:var(--accent)}
.stop.here{color:var(--ink)}
.stop.here i{background:var(--mark);border-color:var(--ink)}

/* exercícios */
.opt{display:block;width:100%;text-align:left;min-height:54px;padding:12px 16px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink)}
.opt.ok{border-color:var(--good);background:var(--good-soft)}
.opt.no{border-color:var(--warn);background:var(--warn-soft)}
.note{border-radius:14px;padding:12px 14px;background:var(--good-soft);color:var(--ink)}
.note.soft{background:var(--warn-soft)}
.note .eyebrow{color:inherit;opacity:.75}
.stat{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat > div{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px}
.stat b{display:block;font:700 26px/1.1 var(--font-display);font-variant-numeric:tabular-nums}
.stat span{font-size:14px;color:var(--muted)}

/* conversa */
.chat{display:flex;flex-direction:column;gap:10px}
.bubble{max-width:88%;padding:12px 14px;border-radius:18px;border:1px solid var(--line);background:var(--surface)}
.bubble.me{align-self:flex-end;background:var(--accent-soft);border-color:transparent;border-bottom-right-radius:6px}
.bubble.tutor{align-self:flex-start;border-bottom-left-radius:6px}
.bubble .tr{margin-top:6px;font:400 14px var(--font-ui);color:var(--muted)}
.bubble .acts{display:flex;gap:4px;margin-top:4px}
.bubble .acts button{border:0;background:none;color:var(--accent);font:700 13px var(--font-ui);min-height:36px;padding:0 8px 0 0}
.fix{align-self:flex-end;max-width:88%;font-size:14px;padding:10px 12px;border-radius:14px;background:var(--warn-soft)}
.fix .alvo{font-size:16px;display:block;margin:2px 0}
.composer{display:flex;gap:8px;align-items:flex-end}
.composer textarea{min-height:52px;height:52px;resize:none}
.composer .btn{width:56px;flex:none;padding:0}
.typing{align-self:flex-start;color:var(--muted);font-size:14px}
.dots{display:inline-flex;gap:4px;vertical-align:middle}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--muted);animation:pulse 1.1s infinite ease-in-out}
.dots i:nth-child(2){animation-delay:.18s}.dots i:nth-child(3){animation-delay:.36s}
@keyframes pulse{0%,80%,100%{opacity:.25}40%{opacity:1}}
@media (prefers-reduced-motion: reduce){ .dots i{animation:none;opacity:.6} }
.loading{display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;padding:36px 12px;color:var(--muted)}
.list{display:flex;flex-direction:column}
.list > div{display:flex;align-items:baseline;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.list > div:last-child{border-bottom:0}
.sit{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sit button{text-align:left;padding:14px;border-radius:16px;border:1px solid var(--line);background:var(--surface);min-height:84px;display:flex;flex-direction:column;gap:4px}
.sit b{font-size:15px}.sit span{font-size:13px;color:var(--muted)}
.hero-sample{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:6px}

.mic{width:56px;flex:none;padding:0}
.mic[aria-pressed="true"]{background:var(--warn-soft);border-color:var(--warn);color:var(--warn)}

/* ===== redesenho: personagens, profundidade e movimento ===== */
:root{ --shadow:0 1px 2px rgba(20,27,51,.06),0 8px 24px rgba(20,27,51,.08); --hero-a:#2B45D4; --hero-b:#7C5CFF; --coral:#FF6B4A; --teal:#14B8A6; --violet:#8B5CF6; --orange:#F0782F }
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --shadow:0 1px 2px rgba(0,0,0,.35),0 10px 26px rgba(0,0,0,.35); --hero-a:#3346CC; --hero-b:#6A49E0 } }
:root[data-theme="dark"]{ --shadow:0 1px 2px rgba(0,0,0,.35),0 10px 26px rgba(0,0,0,.35); --hero-a:#3346CC; --hero-b:#6A49E0 }
.tutor,.avatar{display:inline-block;flex:none;line-height:0}
.tutor svg,.avatar svg{width:100%;height:100%;display:block}
.avatar{border-radius:50%;overflow:hidden;box-shadow:0 0 0 3px var(--surface)}
.card{border-color:transparent;box-shadow:var(--shadow)}
.card.flat{box-shadow:none}
.opt{box-shadow:var(--shadow);border-color:transparent;transition:transform .12s ease}
.opt:active{transform:scale(.98)}
.opt.ok,.opt.no{box-shadow:none}
.btn{transition:transform .12s ease,box-shadow .2s ease}
.btn:active:not(:disabled){transform:scale(.97)}
.btn:not(.sec):not(.link):not(.inv):not(.danger):not(:disabled){box-shadow:0 8px 18px rgba(43,69,212,.28)}
.steps i.on{background:linear-gradient(90deg,var(--hero-a),var(--hero-b))}
nav#tabs{box-shadow:0 -6px 20px rgba(20,27,51,.06)}
nav#tabs button .ic{width:52px;height:30px;border-radius:999px;align-items:center;justify-content:center;transition:background .2s ease}
nav#tabs button .ic svg{width:22px;height:22px}
nav#tabs button[aria-current="page"] .ic{background:var(--accent-soft)}

/* início: cartão do professor */
.hero{position:relative;overflow:hidden;border-radius:26px;padding:20px;color:#FFFFFF;background:linear-gradient(140deg,var(--hero-a),var(--hero-b));display:flex;flex-direction:column;gap:14px;box-shadow:0 14px 32px rgba(60,60,200,.30)}
.hero::before{content:"";position:absolute;width:230px;height:230px;border-radius:50%;right:-80px;top:-100px;background:rgba(255,255,255,.12)}
.hero::after{content:"";position:absolute;width:140px;height:140px;border-radius:50%;left:-50px;bottom:-60px;background:rgba(255,216,74,.18)}
.hero > *{position:relative;z-index:1}
.hero .eyebrow{color:#FFFFFF;opacity:.85}
.hero h2{color:#FFFFFF;font-size:23px}
.hero .chip{background:transparent;color:#FFFFFF;border-color:rgba(255,255,255,.55)}
.hero .chip[aria-pressed="true"]{background:#FFFFFF;color:#2B45D4;border-color:#FFFFFF}
.hero .btn{background:#FFFFFF;color:#2B45D4;box-shadow:0 8px 18px rgba(10,10,60,.25)}
.fala-row{display:flex;align-items:flex-end;gap:8px}
.balao{flex:1;min-width:0;background:#FFFFFF;color:#141B33;border-radius:18px 18px 4px 18px;padding:10px 13px;box-shadow:0 6px 16px rgba(10,10,60,.15)}
.balao .alvo{font-size:19px;font-weight:600;line-height:1.25}
.balao small{display:block;color:#566080;font-size:14px;margin-top:2px}
.card .balao{box-shadow:none;background:var(--sunk);color:var(--ink)}
.card .balao small{color:var(--muted)}
.tutor.toque{cursor:pointer}

/* anéis de habilidade */
@property --p{syntax:'<number>';inherits:false;initial-value:0}
.aneis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.anel{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:13px;color:var(--muted);text-align:center}
.anel i{--p:0;width:64px;height:64px;border-radius:50%;background:conic-gradient(var(--c,var(--accent)) calc(var(--p) * 1%),var(--sunk) 0);display:grid;place-items:center;font-style:normal;transition:--p 1.1s cubic-bezier(.2,.8,.2,1)}
.anel i::after{content:attr(data-v);width:50px;height:50px;border-radius:50%;background:var(--bg);display:grid;place-items:center;font:700 14px var(--font-ui);color:var(--ink);font-variant-numeric:tabular-nums}

/* boas-vindas e escolha do professor */
.elenco{display:flex;justify-content:center;padding-top:6px}
.elenco .tutor{width:64px;height:64px;margin-left:-12px;border-radius:50%;padding:6px;box-shadow:0 0 0 3px var(--bg)}
.elenco .tutor:first-child{margin-left:0}
.idiomas{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.idioma{display:flex;flex-direction:column;align-items:center;gap:4px;padding:14px 8px 12px;border-radius:20px;border:2px solid transparent;background:var(--surface);box-shadow:var(--shadow);text-align:center;color:var(--ink)}
.idioma .tutor{border-radius:50%;padding:5px;margin-bottom:4px}
.idioma[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.idioma b{font-size:16px}
.idioma span{font-size:13px;color:var(--muted)}
.avatares{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.avatares button{border:3px solid transparent;border-radius:50%;padding:3px;background:none;aspect-ratio:1/1}
.avatares button[aria-pressed="true"]{border-color:var(--accent)}
.avatares .avatar{width:100%!important;height:100%!important;box-shadow:none}
.perfil-top{display:flex;align-items:center;gap:14px}

/* professor que reage nos exercícios */
.coach{display:flex;align-items:center;gap:10px;min-height:56px}
.coach-fala{flex:1;min-width:0;background:var(--surface);border-radius:16px 16px 16px 4px;padding:9px 12px;font-size:15px;box-shadow:var(--shadow)}
.msg{display:flex;align-items:flex-end;gap:8px}
.msg.me{justify-content:flex-end}
.msg .bubble{max-width:80%}
.festa{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px}
.festa .tutor{border-radius:50%;padding:10px}
.confete{position:fixed;inset:0;pointer-events:none;z-index:50;width:100%;height:100%}

/* movimento */
@keyframes flutua{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.flutua{animation:flutua 3.4s ease-in-out infinite}
@keyframes pop{0%{transform:scale(.55)}60%{transform:scale(1.12)}100%{transform:scale(1)}}
.pop{animation:pop .5s cubic-bezier(.3,1.6,.5,1)}
@keyframes chacoalha{0%,100%{transform:rotate(0)}25%{transform:rotate(-9deg)}75%{transform:rotate(9deg)}}
.chacoalha{animation:chacoalha .5s ease}
@keyframes entra{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
#view > *{animation:entra .38s ease both}
#view > *:nth-child(2){animation-delay:.04s}#view > *:nth-child(3){animation-delay:.08s}#view > *:nth-child(4){animation-delay:.12s}#view > *:nth-child(5){animation-delay:.16s}#view > *:nth-child(n+6){animation-delay:.2s}
@keyframes chama{0%,100%{transform:scale(1) rotate(-4deg)}50%{transform:scale(1.15) rotate(4deg)}}
.streak .ic{animation:chama 1.8s ease-in-out infinite;transform-origin:50% 85%}
@media (prefers-reduced-motion: reduce){ .flutua,.pop,.chacoalha,.streak .ic,#view > *{animation:none!important} .anel i{transition:none} }

/* fundo colorido: degradê suave na cor do professor de cada pessoa */
:root{ --tint-a:#FF9F7A40; --tint-b:#7C5CFF2E; --tint-c:#FFD84A33 }
#app{background:
  radial-gradient(120% 60% at 100% 0%, var(--tint-a) 0%, transparent 60%),
  radial-gradient(90% 55% at 0% 100%, var(--tint-b) 0%, transparent 62%),
  radial-gradient(60% 40% at 0% 30%, var(--tint-c) 0%, transparent 70%),
  var(--bg)}
nav#tabs{background:color-mix(in srgb, var(--surface) 88%, transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.anel i::after{background:var(--surface)}
.elenco .tutor{box-shadow:0 0 0 3px var(--surface)}

/* ===== modo aventura ===== */
:root{ --tm1:#6D28D9; --tm2:#DB2777 }
.av-topo{position:relative;border-radius:24px;overflow:hidden;color:#FFFFFF;background:linear-gradient(150deg,var(--tm1),var(--tm2));box-shadow:0 14px 30px rgba(40,20,90,.3)}
.av-topo .cena{display:block;width:100%;height:auto}
.av-info{position:absolute;left:14px;right:14px;bottom:12px;display:flex;align-items:flex-end;gap:10px;text-shadow:0 1px 6px rgba(0,0,0,.4)}
.av-canto{position:absolute;top:12px;right:12px}
.moedas{display:inline-flex;align-items:center;gap:5px;background:rgba(10,10,30,.55);color:#FFD84A;border-radius:999px;padding:4px 11px 4px 7px;font-weight:700;font-variant-numeric:tabular-nums}
.moedas .ic{width:18px;height:18px}
.mapa{display:flex;flex-direction:column;gap:14px}
.regiao{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.trilha{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));row-gap:8px;position:relative;padding:4px 0}
.trilha::before{content:"";position:absolute;left:50%;top:16px;bottom:16px;width:4px;margin-left:-2px;border-radius:2px;background:repeating-linear-gradient(var(--line) 0 8px,transparent 8px 16px)}
.no{grid-column:var(--col);justify-self:center;display:flex;flex-direction:column;align-items:center;gap:4px;border:0;background:none;color:var(--ink);font:700 13px var(--font-ui);position:relative;z-index:1}
.no i{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;background:var(--surface);color:var(--muted);box-shadow:var(--shadow),inset 0 -5px 0 rgba(0,0,0,.10);font-style:normal}
.no i .ic{width:28px;height:28px}
.no.chefe i{width:78px;height:78px;background:linear-gradient(150deg,#FBBF24,#F97316);color:#FFFFFF}
.no.feito i{background:var(--good);color:#FFFFFF}

/* ============================== servidor, estado e gravação ============================== */
const lsGet = k => { try { return localStorage.getItem(k); } catch(e){ return null; } };
const lsSet = (k,v) => { try { if (v == null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch(e){} };
const API = String((window.IDIOMA_IA && window.IDIOMA_IA.api) || '').trim();
let TOKEN = lsGet('idioma-ia:token');
let USER = null; try { USER = JSON.parse(lsGet('idioma-ia:user') || 'null'); } catch(e){}
const lsKey = () => 'idioma-ia:v1:' + (USER ? USER.id : 'anon');
const fresh = () => ({ v:1, updatedAt:0, profile:null, level:null, placement:null, xp:0,
  streak:{cur:0,best:0,last:null}, daysStudied:0, skills:{}, vocab:[], errors:[], log:[],
  convo:{turns:0, week:'', weekTurns:0}, ease:0, nextGoal:'', doneToday:'', missions:0 });
let S = fresh();
let saving = false, dirty = false, saveTimer = 0;
function readLocal(){ try { const o = JSON.parse(lsGet(lsKey()) || 'null'); return o && o.v === 1 ? o : null; } catch(e){ return null; } }
function writeLocal(){ lsSet(lsKey(), JSON.stringify(S)); }
function save(){ S.updatedAt = Date.now(); writeLocal(); dirty = true; clearTimeout(saveTimer); saveTimer = setTimeout(flush, 1500); }
async function flush(){
  if (!TOKEN || saving || !dirty) return;
  saving = true; dirty = false;
  try { await api('saveState', {state: JSON.stringify(S), updatedAt: S.updatedAt}); }
  catch(e){ if (!e || e.code !== 'auth') dirty = true; } // sem internet: fica no aparelho e sobe na próxima
  saving = false;
}
// Toda conversa com o servidor passa por aqui. text/plain evita a checagem prévia (CORS) do Apps Script.
async function api(action, payload){
  if (!/^https?:\/\//.test(API)) throw {code:'config_app'};
  let res;
  try { res = await fetch(API, {method:'POST', redirect:'follow', headers:{'Content-Type':'text/plain;charset=utf-8'},
    body: JSON.stringify(Object.assign({action, token:TOKEN}, payload || {}))}); }
  catch(e){ throw {code:'offline'}; }
  let j; try { j = await res.json(); } catch(e){ throw {code:'upstream_error'}; }
  if (!j || !j.ok){
    const err = (j && j.error) || {code:'upstream_error'};
    if (err.code === 'auth' && TOKEN){ encerrarSessao(); telaConta('entrar', 'Sua sessão terminou. Entre de novo.'); }
    throw err;
  }
  return j.data;
}
// Busca o progresso guardado no servidor; devolve true se ele era mais novo que o do aparelho.
async function sincronizar(){
  const r = await api('getState');
  if (r && r.state){
    let o = null; try { o = JSON.parse(r.state); } catch(e){}
    if (o && o.v === 1 && (o.updatedAt || 0) > (S.updatedAt || 0)){ S = Object.assign(fresh(), o); writeLocal(); return true; }
  }
  if (S.updatedAt && (!r || !r.state || (r.updatedAt || 0) < S.updatedAt)){ dirty = true; flush(); }
  return false;
}
function encerrarSessao(){ TOKEN = null; USER = null; lsSet('idioma-ia:token', null); lsSet('idioma-ia:user', null); S = fresh(); dirty = false; ui.tab = 'inicio'; ui.min = null; }

function extrairJSON(t){
  t = String(t || '').trim();
  try { return JSON.parse(t); } catch(e){}
  const f = /```(?:json)?\s*([\s\S]*?)```/.exec(t);
  if (f){ try { return JSON.parse(f[1]); } catch(e){} }
  const ia = [t.indexOf('{'), t.indexOf('[')].filter(i => i >= 0), a = ia.length ? Math.min.apply(null, ia) : -1, b = Math.max(t.lastIndexOf('}'), t.lastIndexOf(']'));
  if (a >= 0 && b > a){ try { return JSON.parse(t.slice(a, b + 1)); } catch(e){} }
  throw {code:'invalid_json'};
}

    .then(d => { const blob = wavBlob(d.audio, d.mime); gravarCacheVoz(k, blob); return blob; }))
    .then(blob => URL.createObjectURL(blob));

}
function pararSom(){

function falarAparelho(texto, pref){
  return new Promise(res => {
    try {
      if (!('speechSynthesis' in window)) return res(false);
      const lang = S.profile.target, lista = vozesAparelho(lang);
      const voz = lista.find(v => v.voiceURI === pref.aparelho) || lista[0];
      const u = new SpeechSynthesisUtterance(texto);

      let feito = false; const fim = () => { if (feito) return; feito = true; if (fimAtual === fim) fimAtual = null; res(true); };
      u.onend = fim; u.onerror = fim; setTimeout(fim, 2500 + texto.length * 110);
      speechSynthesis.cancel(); fimAtual = fim; speechSynthesis.speak(u);
    } catch(e){ res(false); }
  });
}
function tocarUrl(url, pref, texto){
  return new Promise(res => {
    let feito = false; const fim = ok => { if (feito) return; feito = true; if (fimAtual === fim) fimAtual = null; res(ok !== false); };
    try {
      const pl = playerAudio();
      pl.onended = () => fim(true); pl.onerror = () => fim(false);
      pl.src = url; pl.playbackRate = pref.velocidade < 0.8 ? 0.85 : 1;
      fimAtual = fim;

    } catch(e){ fim(false); }
  });
}
// Fala o texto e devolve quando terminar. Se a voz natural demorar, usa a do celular para não deixar em silêncio.
function falar(texto, prefExtra){
  texto = String(texto || '').trim(); if (!texto) return Promise.resolve(false);
  const pref = Object.assign(prefVoz(), prefExtra || {}), id = ++FALA_ID;
  ULTIMA = {texto, prefExtra};
  pararSom();
  if (pref.motor !== 'gemini' || !GEMINI_VOZ_OK) return falarAparelho(texto, pref);
  const limite = new Promise(res => setTimeout(() => res('tempo'), 7000));
  return Promise.race([prepararAudio(texto, prefExtra, true), limite]).then(url => {
    if (id !== FALA_ID) return false;
    if (url === 'tempo' || !url) return falarAparelho(texto, pref);
    return tocarUrl(url, pref, texto);
  }, () => id === FALA_ID ? falarAparelho(texto, pref) : false);
}

      const ord = [T.idx, T.idx + 1, T.idx - 1, T.idx + 2, T.idx - 2, T.idx + 3, T.idx - 3].filter(k => k >= 0 && k < PL.length && pool[PL[k]].length);

        h('p',{class:'alvo',style:'font-size:20px'}, q.p),
        mcq(q, ok => { T.asked.push({idx:usado, ok, tipo:q.tipo}); T.idx = clamp(usado + (ok ? 1 : -1), 0, 3);
          fb.replaceChildren(h('button',{class:'btn',type:'button',onclick:ask},'Próxima')); }), fb);

      const out = h('div');

      let i = LEVELS.indexOf(nivel);

      const acc = Object.keys(tipos).map(k => [k, tipos[k].reduce((s,v) => s + v, 0) / tipos[k].length]).sort((x,y) => y[1] - x[1]);
      acc.forEach(([k,v]) => S.skills[k] = Math.round(v * 100));

// Conta o tempo de uso ativo do app (com a tela aberta e tocada no último minuto).
// Na primeira vez, estima o tempo já estudado a partir das missões, conversas e aventuras feitas.
function T0(){

    S.tempo = {d:{}, total:min * 60, nivel:{lv:S.level, seg:min * 60, desde:today()}, semente:min};
  }
  if (S.tempo.nivel.lv !== S.level) S.tempo.nivel = {lv:S.level, seg:0, desde:today()};
  return S.tempo;
}
let ultimaAcao = Date.now(), tickTempo = 0;
['pointerdown','keydown','touchstart'].forEach(t => document.addEventListener(t, () => { ultimaAcao = Date.now(); }, {capture:true, passive:true}));
setInterval(() => {
  if (!TOKEN || !S.profile || !S.level || document.hidden || Date.now() - ultimaAcao > 60000 || ['welcome','onb'].includes(ui.screen)) return;
  const t = T0(), d = today(); t.d[d] = (t.d[d] || 0) + 10; t.total += 10; t.nivel.seg += 10;
  const ks = Object.keys(t.d); if (ks.length > 120) ks.sort().slice(0, ks.length - 120).forEach(k => delete t.d[k]);
  if (++tickTempo % 6 === 0){ S.updatedAt = Date.now(); writeLocal(); dirty = true; }
}, 10000);
const minutosDia = d => Math.round(((T0().d[d]) || 0) / 60);
function progressoNivel(){
  const i = lv(); if (i < 0) return null;
  const p = S.profile, f = p.native === 'Português' ? LANGS[p.target].f : 1;
  const prox = LEVELS[i + 1] || null, H = Math.round((HORAS[S.level] || 200) * f), t = T0(), horas = t.nivel.seg / 3600;
  const vals = ['conversa','leitura','escrita','vocabulario','gramatica'].map(k => S.skills[k]).filter(v => v != null);
  const dom = vals.length ? Math.round(vals.reduce((a, b) => a + b, 0) / vals.length) : 0;
  const pPrat = Math.min(1, horas / H), pDom = Math.min(1, dom / 75);
  let seg14 = 0; for (let k = 0; k < 14; k++) seg14 += t.d[addDays(today(), -k)] || 0;
  const resto = Math.max(0, H - horas);
  return {prox, H, horas, dom, pPrat, pDom, pct:Math.round((pPrat * .7 + pDom * .3 * Math.min(1, .25 + pPrat * 1.5)) * 100), resto, ritmo:seg14 / 14 / 60,
    dias: min => min > 0 ? Math.ceil(resto * 60 / min) : null, pronto: pPrat >= .85 && dom >= 70};
}
function duracaoTxt(dias){

/* ---------- herói: nível, título e corações ---------- */
const semVazios = k => k.flat(Infinity).filter(x => x != null && x !== false && x !== '');
const TITULOS = ['Aprendiz','Viajante','Aventureiro','Desbravador','Herói','Campeão','Mestre','Lenda'];
const nivelHeroi = hxp => Math.floor(Math.sqrt((hxp || 0) / 40)) + 1;
const hxpDoNivel = n => 40 * (n - 1) * (n - 1);
const tituloHeroi = n => TITULOS[Math.min(n - 1, TITULOS.length - 1)];
const vidasMax = () => 3 + Math.floor((nivelHeroi(J().hxp) - 1) / 3);
function ganharHXP(n){
  const j = J(), antes = nivelHeroi(j.hxp);
  j.hxp = (j.hxp || 0) + n;
  const depois = nivelHeroi(j.hxp);
  if (depois > antes) j.subiu = depois;
  return n;
}
function MW(){ const j = J(); if (!j.mundo) j.mundo = {r:0, pos:{}, vis:{}, voz:{}, falas:{}, abertos:{}, lidos:{}, palavras:{}, packs:{}, explor:{}}; return j.mundo; }

  const cv = document.createElement('canvas'); cv.width = m.W * TILE * escala; cv.height = m.H * TILE * escala;
  const c = cv.getContext('2d'); c.scale(escala, escala);

    const ch = tileEm(m, x, y), X = x * T, Y = y * T;
    c.fillStyle = (x + y) % 2 ? sk.chao : sk.chao2; c.fillRect(X, Y, T, T);
    if (J().tema === 'espaco'){ c.strokeStyle = 'rgba(255,255,255,.05)'; c.strokeRect(X + .5, Y + .5, T - 1, T - 1); }
    else for (let i = 0; i < 3; i++){ const a = ruido(x, y, i); if (a < .55){ c.fillStyle = sk.tufo; const px = X + ruido(x, y, i + 9) * 26 + 3, py = Y + ruido(x, y, i + 17) * 26 + 3; if (J().tema === 'misterio'){ c.fillRect(px, py, 6, 3); } else { c.beginPath(); c.moveTo(px, py + 4); c.lineTo(px + 2, py); c.lineTo(px + 4, py + 4); c.fill(); } } }
    if (ch === ',' || ch === 'P' || (ch === 'G')){

      c.fillStyle = sk.trilha; rr(c, X + 1, Y + 1, T - 2, T - 2, 8); c.fill();
      // emenda com o vizinho

      if (eh(x, y + 1, ',PG=')) c.fillRect(X + 1, Y + T / 2, T - 2, T);
      if (J().tema === 'espaco'){ c.fillStyle = 'rgba(109,124,255,.35)'; c.fillRect(X + T / 2 - 1, Y + 4, 2, T - 8); }

      c.fillStyle = 'rgba(0,0,0,.25)'; c.fillRect(X + 2, Y, 2, T); c.fillRect(X + T - 4, Y, 2, T);
    }

      if (J().tema === 'viagem'){ c.fillStyle = 'rgba(255,255,255,.12)'; for (let i = 0; i < 4; i++){ c.beginPath(); c.arc(X + 4 + i * 8, Y + 5, 4, 0, 7); c.fill(); } }
      else if (J().tema === 'espaco'){ c.fillStyle = 'rgba(109,124,255,.6)'; c.fillRect(X, Y + 10, T, 2); }

  if (it === 'medalha'){ c.fillStyle = '#FFD84A'; c.beginPath(); c.arc(3, -12, 2.4, 0, 7); c.fill(); }

/* ---------- direções geradas a partir do caminho real no mapa ---------- */
function rotaComPoucasCurvas(livre, de, alvos){
  // Dijkstra com custo extra para cada curva: o caminho fica parecido com o que uma pessoa explicaria.
  const D4 = [[0, -1], [1, 0], [0, 1], [-1, 0]], key = (x, y, d) => x + ',' + y + ',' + d, fim = new Set(alvos.map(a => a.x + ',' + a.y));
  const dist = new Map(), veio = new Map(), fila = [];
  for (let d = 0; d < 4; d++){ dist.set(key(de.x, de.y, d), 0); fila.push([0, de.x, de.y, d]); }
  while (fila.length){
    fila.sort((a, b) => a[0] - b[0]);
    const [c, x, y, d] = fila.shift();
    if (c > dist.get(key(x, y, d))) continue;
    if (fim.has(x + ',' + y) && !(x === de.x && y === de.y)){
      const passos = []; let k = key(x, y, d);
      while (veio.has(k)){ const [px, py, pd] = veio.get(k); const [cx, cy] = k.split(',').map(Number); passos.unshift({x:cx, y:cy, d:Number(k.split(',')[2])}); k = key(px, py, pd); }
      return passos;
    }
    D4.forEach(([dx, dy], nd) => {
      const nx = x + dx, ny = y + dy; if (!livre(nx, ny)) return;
      const nc = c + 1 + (nd !== d && !(x === de.x && y === de.y) ? 3 : 0), k2 = key(nx, ny, nd);
      if (nc < (dist.has(k2) ? dist.get(k2) : Infinity)){ dist.set(k2, nc); veio.set(k2, [x, y, d]); fila.push([nc, nx, ny, nd]); }
    });
  }
  return null;
}
function textoDirecoes(passos, alvo){
  const L = DIRECOES[S.profile.target] || DIRECOES.en, D4 = [[0, -1], [1, 0], [0, 1], [-1, 0]];
  if (!passos || !passos.length) return L.frente;
  const partes = [L.reto];
  for (let i = 1; i < passos.length; i++){
    const a = passos[i - 1].d, b = passos[i].d; if (a === b) continue;
    const [hx, hy] = D4[a], [nx, ny] = D4[b], cruz = hx * ny - hy * nx;
    partes.push(cruz > 0 ? L.dir : L.esq);
  }
  const ult = passos[passos.length - 1], [hx, hy] = D4[ult.d], vx = alvo.x - ult.x, vy = alvo.y - ult.y, cruz = hx * vy - hy * vx;
  const frase = partes.slice(0, 4).map((p, i) => i === 0 ? p : (i === partes.length - 1 || i === 3 ? L.depois + ' ' + p : p)).join(', ');
  return frase + '. ' + (cruz > 0 ? L.ladoD : cruz < 0 ? L.ladoE : L.frente);
}
